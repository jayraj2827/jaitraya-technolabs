<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mira-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mira-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="256" height="256" rx="54" fill="url(#mira-bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="52.5" stroke="rgba(139, 92, 246, 0.3)" stroke-width="3"/>

  <!-- Subtle Neural Grid Accent -->
  <circle cx="128" cy="128" r="76" stroke="rgba(99, 102, 241, 0.12)" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="128" cy="128" r="48" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1.5"/>

  <!-- Geometric M Architecture -->
  <path d="M 62 186 V 82 L 108 128 L 128 108 L 148 128 L 194 82 V 186" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Prismatic Prism Inset -->
  <path d="M 108 128 L 128 148 L 148 128 L 128 108 Z" fill="url(#mira-glow)" filter="url(#glow-blur)"/>

  <!-- Sovereign Quantum Core Nodes -->
  <circle cx="62" cy="82" r="7" fill="#38BDF8"/>
  <circle cx="194" cy="82" r="7" fill="#8B5CF6"/>
  <circle cx="128" cy="148" r="5" fill="#FFFFFF"/>
</svg>
